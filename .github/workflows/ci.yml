name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # edited: a new title changes the squash commit, and so the version it releases.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm of .github/etc/package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .github/etc/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false
      # The Go that builds shfmt and actionlint below, and checks their modules against go.sum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false

      # Dependencies included: go checks each module against go.sum, and uv and pnpm install the lockfiles in
      # .github/etc, which Dependabot keeps up to date.
      - name: Install the linters
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          uv sync --frozen --project .github/etc
          echo "$PWD/.github/etc/.venv/bin" >> "$GITHUB_PATH"
          pnpm install --dir .github/etc --frozen-lockfile
          echo "$PWD/.github/etc/node_modules/.bin" >> "$GITHUB_PATH"

      - uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        with:
          version: v4.0.2

      - name: Run make lint
        # --keep-going: one red linter does not hide what the others find.
        run: make --keep-going lint
        env:
          # zizmor's online audits (impostor commits, known vulnerable actions) read the API with it.
          GH_TOKEN: ${{ github.token }}

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action itself installs convco, checked against its sha256.
      - uses: ./

      - name: Check the pull request's commits
        run: convco check "$BASE_SHA..$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Check the pull request's title
        # A squash merge makes the title the commit message on main.
        run: printf '%s\n' "$PR_TITLE" | convco check --from-stdin
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  readme-version:
    name: README examples use the released version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Make the commit a squash merge would make
        # The checkout is the pull request merged into its base (the first parent): one commit with the same tree and
        # the pull request's title is what main gets.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft HEAD^1
          git commit --allow-empty --no-verify -m "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - uses: ./
        id: version

      - name: Check the README
        run: .github/scripts/check-readme-version.sh "$EXPECTED"
        env:
          EXPECTED: >-
            ${{ steps.version.outputs.has-changes == 'true'
              && steps.version.outputs.next-version-tag
              || steps.version.outputs.current-version-tag }}
