name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # edited: a new title changes the squash commit, and so the version it releases.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ponytail: the tools are pinned, their dependencies are not; a package-lock.json and a requirements file with
      # hashes would pin those too.
      - name: Install the linters
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          pipx install shellcheck-py==0.11.0.1 zizmor==1.30.1 yamllint==1.38.0 typos==1.51.1

      - name: Install markdownlint
        run: npm install --global markdownlint-cli2@0.23.2 # zizmor: ignore[adhoc-packages] one CLI, exact version

      - uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        with:
          version: v4.0.2

      - name: Run make lint
        # --keep-going: one red linter does not hide what the others find.
        run: make --keep-going lint
        env:
          # zizmor's online audits (impostor commits, known vulnerable actions) read the API with it.
          GH_TOKEN: ${{ github.token }}

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action itself installs convco, checked against its sha256.
      - uses: ./

      - name: Check the pull request's commits
        run: convco check "$BASE_SHA..$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Check the pull request's title
        # A squash merge makes the title the commit message on main.
        run: printf '%s\n' "$PR_TITLE" | convco check --from-stdin
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  readme-version:
    name: README examples use the released version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Make the commit a squash merge would make
        # The checkout is the pull request merged into its base (the first parent): one commit with the same tree and
        # the pull request's title is what main gets.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft HEAD^1
          git commit --allow-empty --no-verify -m "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - uses: ./
        id: version

      - name: Check the README
        run: .github/scripts/check-readme-version.sh "$EXPECTED"
        env:
          EXPECTED: >-
            ${{ steps.version.outputs.has-changes == 'true'
              && steps.version.outputs.next-version-tag
              || steps.version.outputs.current-version-tag }}
