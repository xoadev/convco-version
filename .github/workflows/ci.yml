name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # edited: a new title changes the squash commit, and so the version it releases.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Prettier and markdownlint run through Deno; the other linters come with xoa-base's action, which needs Go.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - uses: xoadev/xoa-base/.github/actions/linters@5347caf2ec8516d2828ded1cb7c4d9d59977e5c1 # v0.1.3

      - name: Run make check
        # -k: one red check does not hide what the others find.
        run: make -k check
        env:
          # zizmor's online audits (impostor commits, known vulnerable actions) read the API with it.
          GH_TOKEN: ${{ github.token }}

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action itself installs convco, checked against its sha256.
      - uses: ./

      - name: Check the pull request's commits
        run: convco check "$BASE_SHA..$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Check the pull request's title
        # A squash merge makes the title the commit message on main.
        run: printf '%s\n' "$PR_TITLE" | convco check --from-stdin
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  readme-version:
    name: README examples use the released version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Make the commit a squash merge would make
        # The checkout is the pull request merged into its base (the first parent): one commit with the same tree and
        # the pull request's title is what main gets.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft HEAD^1
          git commit --allow-empty --no-verify -m "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - uses: ./
        id: version

      - name: Check the README
        run: .github/scripts/check-readme-version.sh "$EXPECTED"
        env:
          EXPECTED: >-
            ${{ steps.version.outputs.has-changes == 'true'
              && steps.version.outputs.next-version-tag
              || steps.version.outputs.current-version-tag }}
