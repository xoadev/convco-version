version: 2
updates:
  # The workflows and the composite action in action.yml, whose SHA pins keep their version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']

  # The linters' lockfiles: markdownlint-cli2's pnpm-lock.yaml, which the npm ecosystem covers, and the pip-installed
  # ones in requirements.in.
  - package-ecosystem: npm
    directory: /.github/etc
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /.github/etc
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      pip:
        patterns: ['*']
