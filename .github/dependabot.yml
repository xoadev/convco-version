version: 2
updates:
  # The workflows and the composite action in action.yml, whose SHA pins keep their version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
